                    <script>
                    // Lore panel audio hover effects
                    function setupPanelAudio(panelId, audioId) {
                        const panel = document.getElementById(panelId);
                        const audio = document.getElementById(audioId);
                        let playing = false;
                        panel.addEventListener('mouseenter', () => {
                            if (!playing) {
                                audio.currentTime = 0;
                                audio.play();
                                playing = true;
                            }
                        });
                        panel.addEventListener('mouseleave', () => {
                            audio.pause();
                            audio.currentTime = 0;
                            playing = false;
                        });
                        audio.addEventListener('ended', () => {
                            playing = false;
                        });
                    }
                    setupPanelAudio('music-panel', 'music-audio');
                    setupPanelAudio('gaming-panel', 'gaming-audio');
                    setupPanelAudio('fiction-panel', 'fiction-audio');
                    </script>
